<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZTA Gateway — Login</title>
  <style>
    body { font-family: sans-serif; max-width: 380px; margin: 80px auto; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 8px 18px; background: #337ab7; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    a { color: #337ab7; }
    .flash { background: #fff3cd; border: 1px solid #ffeeba; color: #856404;
             padding: 10px; margin-bottom: 16px; border-radius: 4px; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <input name="username" placeholder="Username">
    <input name="password" type="password" placeholder="Password">
    <button type="submit">Login</button>
  </form>
  <p>No account? <a href="{{ url_for('main.register') }}">Register</a></p>
</body>
</html>
