<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZTA Gateway — {{ heading }}</title>
  <style>
    body { font-family: sans-serif; max-width: 460px; margin: 80px auto;
           padding: 0 18px; }
    h1 { font-size: 1.4em; }
    .card { border-left: 4px solid #337ab7; background: #f7f9fc;
            padding: 16px 18px; border-radius: 4px; }
    a.btn { display: inline-block; margin-top: 14px; padding: 9px 18px;
            background: #337ab7; color: #fff; text-decoration: none;
            border-radius: 4px; }
  </style>
</head>
<body>
  <h1>{{ heading }}</h1>
  <div class="card">{{ message }}</div>
  {% if link_url %}
    <a class="btn" href="{{ link_url }}">{{ link_text or "Continue" }}</a>
  {% endif %}
</body>
</html>
